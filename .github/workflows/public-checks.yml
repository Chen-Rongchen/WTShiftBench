name: Public checks

on:
  push:
    branches: [main]
    paths: ['reproducibility/v1.2.0/**', '.github/workflows/public-checks.yml', 'scripts/release/validate_public_bundle.py', 'tests/test_public_bundle.py']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.66.0
          manifest-path: reproducibility/v1.2.0/pixi.toml
          environments: core
          frozen: true
          cache: true
      - name: Run tests
        working-directory: reproducibility/v1.2.0
        run: pixi run --frozen --environment core python -m pytest tests -q
