name: Validate public reproducibility bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.41.4
          environments: core
          cache: true

      - name: Validate environment
        run: pixi run --environment core check-env

      - name: Run tests
        run: pixi run --environment core test

      - name: Validate public bundle
        run: pixi run --environment core validate-release
