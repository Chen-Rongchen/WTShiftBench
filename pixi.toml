[workspace]
name = "wtshiftbench"
version = "1.1.0"
channels = ["pytorch", "nvidia", "conda-forge", "bioconda"]
platforms = ["linux-64"]

[activation.env]
PYTHONNOUSERSITE = "1"
# 使脚本可直接导入仓库内的 scripts/ 与 src/ 模块
PYTHONPATH = ".:scripts:src"

# ============================================================
# Feature 定义：各环境的依赖集合
# ============================================================

# Core Feature: WT Benchmark 主链路
[feature.core.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
scikit-learn = "*"
pyyaml = "*"
rich = "*"
typer = "*"
anndata = "*"
pytest = "*"
matplotlib = "*"

# GEARS Feature: GEARS Prediction Producer
[feature.gears.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
scanpy = "*"
scikit-learn = "*"
matplotlib = "*"
tqdm = "*"
dcor = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
pytorch-lightning = ">=2.4,<2.6"
torch-geometric = ">=2.5,<2.7"

# scGPT Feature: scGPT Prediction Producer
[feature.scgpt.dependencies]
python = "3.10.*"
pip = "*"
ipython = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
scanpy = "*"
scikit-learn = "*"
pytorch = ">=2.3,<2.4"
pytorch-cuda = "12.1.*"
torchtext = "0.18.*"
transformers = ">=4.37,<5.0"
datasets = ">=2.3,<3.0"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"

# Geneformer Feature: Geneformer Prediction Producer
[feature.geneformer.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
transformers = ">=4.37,<5.0"
datasets = "*"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"

# CPA Feature: CPA Sensitivity Entrant
[feature.cpa.dependencies]
python = "3.10.*"
pip = "*"
wheel = "*"
numpy = ">=1.22.4,<1.24"
pandas = "*"
anndata = ">=0.7,<0.10"
pytorch = ">=1.10,<2.0"
scvi-tools = ">=0.15,<0.21"
scanpy = "*"
scipy = "*"
matplotlib = "*"
seaborn = "*"

# Optional formal model features. These are isolated because each upstream
# package carries its own dependency assumptions.
[feature.cellot.dependencies]
python = "3.9.*"
pip = "*"
git = "*"
wheel = "*"

[feature.scgen.dependencies]
python = "3.10.*"
pip = "*"
wheel = "*"

# ============================================================
# 环境定义：组合 features
# ============================================================

[environments.core]
solve-group = "core"
features = ["core"]

[environments.gears]
solve-group = "gears"
features = ["gears"]

[environments.scgpt]
solve-group = "scgpt"
features = ["scgpt"]

[environments.geneformer]
solve-group = "geneformer"
features = ["geneformer"]

[environments.cpa]
solve-group = "cpa"
features = ["cpa"]

[environments.cellot]
solve-group = "cellot"
features = ["cellot"]

[environments.scgen]
solve-group = "scgen"
features = ["scgen"]

# ============================================================
# Tasks: 环境安装
# ============================================================
[tasks.env-install-core]
cmd = "pixi install --environment core"
description = "安装 core 环境"

[tasks.env-install-gears]
cmd = "pixi install --environment gears"
description = "安装 GEARS 环境"

[tasks.env-install-scgpt]
cmd = "pixi install --environment scgpt"
description = "安装 scGPT 环境"

[tasks.env-install-geneformer]
cmd = "pixi install --environment geneformer"
description = "安装 Geneformer 环境"

[tasks.env-install-cpa]
cmd = "pixi install --environment cpa"
description = "安装 CPA 环境"

[tasks.env-install-cellot]
cmd = "pixi install --environment cellot"
description = "安装 CellOT 候选环境"

[tasks.env-install-scgen]
cmd = "pixi install --environment scgen"
description = "安装 scGen 候选环境"

[tasks.pip-install-gears]
cmd = "python -m pip install --timeout 120 --no-deps cell-gears==0.1.2"
description = "在 GEARS Pixi 环境内安装 PyPI 包"

[tasks.pip-install-scgpt]
cmd = "python -m pip install --timeout 120 --no-deps scgpt==0.2.4"
description = "在 scGPT Pixi 环境内安装 PyPI 包"

[tasks.pip-install-geneformer]
cmd = "rm -rf /tmp/wtko_geneformer_install && GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://huggingface.co/ctheodoris/Geneformer /tmp/wtko_geneformer_install && python -m pip install --timeout 120 --no-deps /tmp/wtko_geneformer_install"
description = "在 Geneformer Pixi 环境内安装 PyPI/Git 包"

[tasks.pip-install-cpa]
cmd = "python -m pip install --timeout 120 --constraint configs/env/cpa_constraints_v1.txt cpa-tools==0.8.8"
description = "在 CPA Pixi 环境内安装 PyPI 包"

[tasks.pip-install-cellot]
cmd = "rm -rf /tmp/wtko_cellot_install && git clone --depth 1 https://github.com/bunnech/cellot /tmp/wtko_cellot_install && python -m pip install --timeout 120 --constraint configs/env/cellot_constraints_v1.txt /tmp/wtko_cellot_install && env -u https_proxy -u http_proxy -u all_proxy -u HTTPS_PROXY -u HTTP_PROXY -u ALL_PROXY python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --timeout 120 array-api-compat natsort python-dateutil six typing_extensions numpy pandas scipy scikit-learn anndata pyyaml absl-py filelock jinja2 networkx 'sympy>=1.13.3'"
description = "在 CellOT Pixi 环境内安装官方源码包"

[tasks.pip-install-scgen]
cmd = "python -m pip install --timeout 120 --constraint configs/env/scgen_constraints_v1.txt scgen"
description = "在 scGen Pixi 环境内安装 PyPI 包"

[tasks.pip-install-model-packages]
cmd = "pixi run --environment gears pip-install-gears && pixi run --environment scgpt pip-install-scgpt && pixi run --environment geneformer pip-install-geneformer && pixi run --environment cpa pip-install-cpa && pixi run --environment cellot pip-install-cellot && pixi run --environment scgen pip-install-scgen"
description = "Install packages required by the formal model environments"

[tasks.fetch-geneformer-gf-12l-95m-i4096]
cmd = "hf download ctheodoris/Geneformer --include \"gf-12L-95M-i4096/*\" --local-dir models/pretrained/geneformer_gf_12l_95m_i4096 --revision 933ca80e39d421c47a12168699766bb7e4e2c197"
description = "下载 gf-12L-95M-i4096 权重（model.safetensors）到 models/pretrained/"

[tasks.env-install-all]
cmd = "pixi install"
description = "安装所有环境"

# ============================================================
# Tasks: 环境检查
# ============================================================
[tasks.env-check-core]
cmd = "python scripts/env/check_core_env.py"
description = "验证 core 环境"

[tasks.env-check-gears]
cmd = "python scripts/env/check_gears_env.py"
description = "验证 GEARS 环境，要求 GPU 可用"

[tasks.env-check-scgpt]
cmd = "python scripts/env/check_scgpt_env.py"
description = "验证 scGPT 环境，要求 GPU 可用"

[tasks.env-check-geneformer]
cmd = "python scripts/env/check_geneformer_env.py"
description = "验证 Geneformer 环境，要求 GPU 可用"

[tasks.env-check-cpa]
cmd = "python -c \"import cpa; print('cpa import ok')\""
description = "验证 CPA 环境"

[tasks.env-check-cellot]
cmd = "python scripts/env/check_optional_model_env.py cellot"
description = "验证 CellOT 候选环境"

[tasks.env-check-scgen]
cmd = "python scripts/env/check_optional_model_env.py scgen"
description = "验证 scGen 候选环境"

[tasks.check-envs]
cmd = "pixi run --environment core env-check-core && pixi run --environment gears env-check-gears && pixi run --environment scgpt env-check-scgpt && pixi run --environment geneformer env-check-geneformer && pixi run --environment cpa env-check-cpa"
description = "验证所有环境"

[tasks.check-optional-model-envs]
cmd = "pixi run --environment cellot env-check-cellot && pixi run --environment scgen env-check-scgen"
description = "Validate optional formal model environments"

# ============================================================
# Tasks: 版本检查
# ============================================================
[tasks.versions-core]
cmd = "python scripts/env/print_versions.py core"
description = "打印 core 环境版本信息"

[tasks.versions-gears]
cmd = "python scripts/env/print_versions.py gears"
description = "打印 GEARS 环境版本信息"

[tasks.versions-scgpt]
cmd = "python scripts/env/print_versions.py scgpt"
description = "打印 scGPT 环境版本信息"

[tasks.versions-geneformer]
cmd = "python scripts/env/print_versions.py geneformer"
description = "打印 Geneformer 环境版本信息"

[tasks.versions-cpa]
cmd = "python - <<'PY'\nimport importlib.metadata as md\nimport cpa\nprint('cpa import ok')\nfor pkg in ['cpa-tools','torch','scanpy','anndata','scvi-tools']:\n    try:\n        print(pkg, md.version(pkg))\n    except md.PackageNotFoundError:\n        print(pkg, 'not installed')\nPY"
description = "打印 CPA 环境版本信息"

[tasks.check-all]
cmd = "pixi run --environment core versions-core && pixi run --environment gears versions-gears && pixi run --environment scgpt versions-scgpt && pixi run --environment geneformer versions-geneformer && pixi run --environment cpa versions-cpa"
description = "打印所有环境版本信息"

[tasks.test-stage2]
cmd = "pytest tests/test_hcc_prediction_export.py tests/test_model_structure_scorer.py tests/test_truth_driven_bridge.py tests/test_truth_sensitivity.py"
description = "运行当前 Stage 2 测试"

# Stable public entry points used in README and CI.
[tasks.setup]
cmd = "pixi install --environment core"
description = "Install the core reproducibility environment"

[tasks.check-env]
cmd = "python scripts/env/check_core_env.py"
description = "Validate the core reproducibility environment"

[tasks.test]
cmd = "pytest -q"
description = "Run the public test suite"

[tasks.build-figures]
cmd = "bash reproduce_figures.sh"
description = "Regenerate active editable SVG panels and panel source data"

[tasks.materialize-edfig1]
cmd = "python scripts/figures/materialize_extended_data_figure1.py"
description = "Materialize Extended Data Figure 1 profile and readout inputs"

[tasks.build-registry]
cmd = "python scripts/pipeline/build_resource_registry.py --config configs/resource_registry_v1.json && cp benchmark/registry/figure_source_data_manifest.tsv source_data/figure_source_data_manifest.tsv"
description = "Rebuild the governed benchmark registry"

[tasks.plan-data]
cmd = "python scripts/download/build_dataset_acquisition_manifest.py --config configs/dataset_acquisition_registry_v1.json"
description = "Generate the public dataset-acquisition plan"

[tasks.download-gse90063]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json"
description = "Download GSE90063 supplementary files"

[tasks.download-gse264667]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json"
description = "Download GSE264667 supplementary files"

[tasks.wtbench]
cmd = "python -m wtbench"
description = "WT Benchmark 统一 CLI 入口；命令由 configs/runtime/wtbench_cli_v1.json 动态注册"

[tasks.download-gse90063-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json --dry-run --test-records"
description = "离线测试 GSE90063 supplementary 下载入口，不访问网络或下载大文件"

[tasks.download-gse90063-supplementary]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json"
description = "下载 GSE90063 supplementary 全量文件"

[tasks.plan-dataset-acquisition]
cmd = "python scripts/download/build_dataset_acquisition_manifest.py --config configs/dataset_acquisition_registry_v1.json"
description = "生成原始来源优先的数据集下载 manifest 和 shell 计划"

[tasks.audit-local-datasets]
cmd = "python scripts/pipeline/audit_local_dataset_inventory.py --config configs/dataset_acquisition_registry_v1.json"
description = "审计本地 HCC/K562/候选数据集是否已存在及 h5ad 基本结构"

[tasks.download-gse264667-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json --dry-run"
description = "只生成 GSE264667 GEO supplementary manifest，不下载文件"

[tasks.download-gse264667-supplementary]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json"
description = "下载 GSE264667 GEO supplementary 文件"

[tasks.download-gse200201-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse200201_supplementary_v1.json --dry-run"
description = "只生成 GSE200201 MOLM13 GEO supplementary manifest，不下载文件"

[tasks.download-gse90546-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse90546_supplementary_v1.json --dry-run"
description = "只生成 GSE90546 Adamson K562 GEO supplementary manifest，不下载文件"

# ============================================================
# Tasks: Stage 2 / manuscript 主链路任务
# ============================================================

[tasks.build-stage2-truth-driven-bridge]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_hcc38_hcc1143_v1.json"
description = "构建 Stage 2 truth-driven bridge 主线产物"

[tasks.convert-rnai-demeter2-depmap-endpoints]
cmd = "python scripts/convert_rnai_demeter2_to_depmap_endpoints.py --config configs/rnai_demeter2_conversion_v1.json"
description = "把 DEMETER2 RNAi 分数转换为现有 bridge 可读取的 DepMap endpoint 宽表"

[tasks.build-stage2-truth-driven-bridge-k562-7d-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_dixit_k562_tf_7d_gse90063_rnai_demeter2_v1.json"
description = "构建 GSE90063 K562 7d CRISPR KO truth 对 DEMETER2 RNAi endpoint 的对照 bridge"

[tasks.build-stage2-truth-driven-bridge-k562-13d-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_dixit_k562_tf_13d_gse90063_rnai_demeter2_v1.json"
description = "构建 GSE90063 K562 13d CRISPR KO truth 对 DEMETER2 RNAi endpoint 的对照 bridge"

[tasks.build-stage2-truth-driven-bridge-hcc38-hcc1143-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_hcc38_hcc1143_rnai_demeter2_v1.json"
description = "构建 HCC38 + HCC1143 CRISPR KO truth 对 DEMETER2 RNAi endpoint 的对照 bridge"

[tasks.run-stage2-hcc38-hcc1143-rnai-endpoint-consistency]
cmd = "python scripts/pipeline/k562_rnai_endpoint_consistency.py --config configs/hcc38_hcc1143_rnai_endpoint_consistency_v1.json"
description = "汇总 HCC38 + HCC1143 的 CRISPR DepMap vs DEMETER2 RNAi endpoint consistency"

[tasks.build-stage2-replogle-k562-gwps-day8]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_replogle_k562_gwps_day8_v1.json"
description = "构建 Replogle K562 GWPS day 8 CRISPRi 的 boundary-aware bridge-form evidence"

[tasks.run-stage2-k562-rnai-endpoint-consistency]
cmd = "python scripts/pipeline/k562_rnai_endpoint_consistency.py --config configs/k562_rnai_endpoint_consistency_v1.json"
description = "汇总 GSE90063 K562 7d/13d 的 CRISPR DepMap vs DEMETER2 RNAi endpoint consistency"

[tasks.build-stage2-truth-driven-bridge-with-dixit]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_hcc38_hcc1143_dixit_v1.json"
description = "Stage 2 truth bridge：HCC38 + HCC1143 + Dixit（同参数，输出写入同一 stage2 目录）"

[tasks.run-stage2-truth-bridge-sensitivity]
cmd = "python scripts/pipeline/truth_bridge_sensitivity.py --config configs/truth_bridge_sensitivity_v1.json"
description = "Stage 2 truth bridge：control 子抽样、DEG 阈值扫描等敏感性分析"

[tasks.run-stage2-truth-bridge-sensitivity-hcc-full]
cmd = "python scripts/pipeline/truth_bridge_sensitivity.py --config configs/truth_bridge_sensitivity_hcc_full_v1.json"
description = "Stage 2 truth bridge：HCC full closure sensitivity（含 5 条 covariate 轴）"

[tasks.materialize-stage2-covariates]
cmd = "python scripts/materialize/covariates.py --config configs/hcc_covariates_v1.json"
description = "物化 HCC Stage 2 covariates TSV"

[tasks.run-stage2-covariate-audit]
cmd = "python scripts/pipeline/covariate_audit.py --config configs/truth_bridge_covariate_audit_v1.json"
description = "运行 HCC Stage 2 covariate balance audit"

[tasks.run-stage2-closure-pipeline]
cmd = "python scripts/pipeline/closure_pipeline.py --config configs/closure_pipeline_v1.json"
description = "串联 HCC covariates、sensitivity 与 covariate audit"

[tasks.validate-stage2-closure-artifacts]
cmd = "python scripts/pipeline/validate_closure_artifacts.py --config configs/closure_artifact_validation_v1.json"
description = "校验 Stage 2 closure 关键产物与固定边界"

[tasks.build-stage2-truth-bridge-decomposition]
cmd = "python scripts/pipeline/truth_bridge_decomposition.py --config configs/truth_bridge_decomposition_v1.json"
description = "构建 Stage 2 truth bridge decomposition 产物"

[tasks.build-stage2-truth-driven-bridge-dixit-supplement]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_dixit_k562_supplement.json"
description = "构建 Dixit/K562 13d supplementary truth bridge"

[tasks.run-stage2-dixit-axis-compression]
cmd = "python scripts/pipeline/dixit_axis_compression.py --config configs/dixit_axis_compression_v1.json"
description = "运行 Dixit/K562 13d supplementary axis compression"

[tasks.run-stage2-dixit-temporal-panel]
cmd = "python scripts/pipeline/dixit_temporal_panel.py --config configs/dixit_k562_temporal_panel_gse90063_v1.json"
description = "汇总 GSE90063 K562 13d/7d temporal panel"

[tasks.run-stage2-k562-13d-minimal-tradeoff-audit]
cmd = "python scripts/pipeline/k562_13d_minimal_tradeoff_audit.py --config configs/k562_13d_minimal_model_tradeoff_audit_v1.json"
description = "运行 GSE90063 K562 13d 最小 model-side architecture trade-off 方向审计"

[tasks.build-public-figures]
cmd = "bash reproduce_figures.sh"
description = "Regenerate active public figure panels under figures/"

[tasks.build-resource-registry]
cmd = "python scripts/pipeline/build_resource_registry.py --config configs/resource_registry_v1.json"
description = "生成 endpoint-anchored benchmark resource registry TSV 文件"

[tasks.validate-release]
cmd = "python scripts/release/validate_public_bundle.py"
description = "验证暂存区只包含公开代码、registry、活动 SVG panel 与 source data"

[tasks.run-external-bridge-form-robustness]
cmd = "python scripts/pipeline/external_bridge_form_robustness.py"
description = "汇总 primary/external/candidate contexts 的 observed shift-DepMap bridge-form robustness"

[tasks.build-gse264667-category-grid]
cmd = "python scripts/pipeline/gse264667_endpoint_category_grid.py"
description = "生成 GSE264667 HepG2/Jurkat secondary endpoint-extension category grid"

[tasks.run-category-response-contrast-gsea]
cmd = "python scripts/pipeline/category_response_contrast_gsea.py"
description = "运行 HCC38/HCC1143 endpoint-category response-level contrast GSEA"

[tasks.build-dataset-governance-table]
cmd = "python scripts/pipeline/dataset_governance_decision_table.py"
description = "生成 dataset evidence-layer / eligibility governance decision table"

[tasks.run-model-score-calibration]
cmd = "python scripts/pipeline/model_score_calibration_controls.py --config configs/model_score_calibration_controls_v1.json"
description = "运行模型层 null/control score calibration"

[tasks.run-model-endpoint-recovery]
cmd = "python scripts/pipeline/model_endpoint_recovery.py"
description = "运行 HCC 模型 endpoint recovery 与 axis-free output-homogenization 审计"

[tasks.audit-hcc-model-after-run]
cmd = "python scripts/pipeline/audit_hcc_model_after_run.py"
description = "单个 HCC 模型跑完并 export 后，立即执行 endpoint/axis/stress 审计"

[tasks.audit-candidate-models]
cmd = "python scripts/pipeline/audit_candidate_model_eligibility.py --config configs/candidate_model_eligibility_v1.json"
description = "Audit CPA, CellOT and scGen model-family eligibility"

[tasks.prepare-cellot-hcc38-smoke]
cmd = "python scripts/models/cellot/prepare_cellot_hcc_smoke.py --cell-line HCC38 --max-targets 3"
description = "为 CellOT HCC38 smoke 生成 per-target h5ad/config/command staging 文件"

[tasks.prepare-cellot-hcc1143-smoke]
cmd = "python scripts/models/cellot/prepare_cellot_hcc_smoke.py --cell-line HCC1143 --max-targets 3"
description = "为 CellOT HCC1143 smoke 生成 per-target h5ad/config/command staging 文件"

[tasks.prepare-cellot-hcc38-full]
cmd = "python scripts/models/cellot/prepare_cellot_hcc_smoke.py --cell-line HCC38 --max-targets 0"
description = "为 CellOT HCC38 full target set 生成 per-target h5ad/config/command staging 文件"

[tasks.prepare-cellot-hcc1143-full]
cmd = "python scripts/models/cellot/prepare_cellot_hcc_smoke.py --cell-line HCC1143 --max-targets 0"
description = "为 CellOT HCC1143 full target set 生成 per-target h5ad/config/command staging 文件"

[tasks.run-scgen-hcc38-smoke]
cmd = "python scripts/models/scgen/run_scgen_hcc_smoke.py --cell-line HCC38 --max-epochs 20 --max-targets 3"
description = "运行 scGen HCC38 小规模 smoke，输出 raw predicted_shift"

[tasks.run-scgen-hcc1143-smoke]
cmd = "python scripts/models/scgen/run_scgen_hcc_smoke.py --cell-line HCC1143 --max-epochs 20 --max-targets 3"
description = "运行 scGen HCC1143 小规模 smoke，输出 raw predicted_shift"

[tasks.export-cpa-hcc38-full]
cmd = "python scripts/models/cpa/export_cpa_predicted_shift.py --cell-line HCC38 --raw-prediction-path reports/model_eligibility/cpa_full_materialization/predicted_shift_HCC38.tsv.gz"
