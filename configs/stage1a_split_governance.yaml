# Stage 1A 目标划分与 split 预注册（与 docs/protocol_blueprint.md 第 5.1A 节一致）
stage: stage1a_split_governance
version: "1.0"
split_scheme: B

# pseudobulk eligibility：perturbed 与 control 两侧均须达到该下限（与 MIN_CELLS_PER_GROUP 同义）
min_cells_per_group: 5
require_umi_depth_column: true

# 预注册 split seeds（主分析禁止改用 0–4 或未登记集合）
split_seeds: [101, 202, 303, 404, 505]

# 冻结 truth / aligned 主榜默认使用的 seed（须为 split_seeds 之一）
default_split_seed_for_truth_freeze: 101

# adapter 内随机性等；多 seed 主分析暂不展开，仅保留字段
training_seed_default: 123
