stage: stage1a_prediction_contract
version: 2
scope: stage1a_formal_mainline
primary_scoring_space: main_aligned  # dataset-local evaluation space per Blueprint 4.3.4
rules:
  main_leaderboard_only_scores_in: main_aligned
  main_leaderboard_forbids_respace_during_evaluation: true
  coverage_policy:
    official_leaderboard_requirements:
      target_coverage: frozen_truth_target_set_full_coverage
      gene_coverage: dataset_local_gene_space_full_coverage  # per dataset, not common intersection
    degraded_policy:
      allow_intersection_alignment_and_scoring: true
      degraded_status: degraded_or_supplementary_only
      degraded_note: 若 target 或 gene 未全覆盖，仍可在交集子空间对齐与评分，但不得直接视为正式主榜结果。
  prediction_matrix_format: tsv_or_tsv_gz_wide_matrix
  required_first_column: target_gene
  target_axis: rows
  gene_axis: columns
  target_order_rule: must_align_to_frozen_truth_target_order
  gene_order_rule: must_align_to_dataset_local_truth_gene_order  # dataset-local per Blueprint 4.3.4
  missing_target_policy:
    allow_missing_targets: true
    alignment_behavior: drop_missing_targets_from_scoring_set_and_record_them
  missing_gene_policy:
    allow_missing_genes: true
    alignment_behavior: drop_missing_genes_then_project_to_dataset_local_gene_space  # dataset-local
  extra_target_policy:
    allow_extra_targets: true
    alignment_behavior: ignore_extra_targets_not_in_frozen_truth
  extra_gene_policy:
    allow_extra_genes: true
    alignment_behavior: ignore_extra_genes_not_in_dataset_local_truth  # dataset-local
  formal_scoring_rule: only_intersection_of_frozen_truth_targets_and_prediction_targets_is_scored
  leaderboard_note: 正式主榜只在 dataset-local main_aligned evaluation space 上评分（per Blueprint 4.3.4），且要求 frozen truth targets 全覆盖；任何 coverage 不足的结果只能作为 degraded_or_supplementary_only。
prediction_contract_fields:
  dataset_id:
    required: true
    type: string
    description: 必须对应 frozen aligned truth registry 中的正式 dataset_id。
  model_id:
    required: true
    type: string
    description: 黑盒模型唯一标识，用于输出目录与报告聚合。
  prediction_space:
    required: true
    type: string
    allowed_examples:
      - X_raw_expression
      - X_log1p_expression
      - X_pseudobulk_delta
      - custom
    description: 必须明确说明预测值语义；若为正式主榜，推荐直接输出 X_pseudobulk_delta。
  prediction_space_notes:
    required: false
    type: string
    description: 说明 normalization、reference baseline、batch averaging 等 run-specific 细节。
  target_index_column:
    required: true
    fixed_value: target_gene
    description: target 行索引列名固定为 target_gene。
  gene_columns:
    required: true
    type: ordered_string_array
    description: 预测矩阵基因列集合；ingest 时将映射到对应 dataset 的 frozen aligned truth gene space。
  prediction_path:
    required: true
    type: path
    description: 模型原始输出矩阵路径。
  output_path:
    required: true
    type: path
    description: 对齐后的正式输出路径，建议写入 data/predictions/stage1a_main_aligned/<model_id>/<dataset_id>/predicted_shift_aligned.tsv.gz。
  allow_missing_targets:
    required: true
    type: boolean
  allow_missing_genes:
    required: true
    type: boolean
  evaluation_space_target:
    required: true
    fixed_value: main_aligned
    description: 正式评分目标空间固定为 main_aligned。
  truth_registry_source:
    required: true
    fixed_value: data/frozen/stage1a_truth/aligned_truth_registry.tsv
outputs:
  aligned_prediction_matrix:
    path_template: data/predictions/stage1a_main_aligned/<model_id>/<dataset_id>/predicted_shift_aligned.tsv.gz
  alignment_summary:
    path_template: reports/stage1a/prediction_alignment/<model_id>/<dataset_id>/alignment_summary.json
  alignment_manifest:
    path_template: reports/stage1a/prediction_alignment/<model_id>/<dataset_id>/alignment_manifest.json
scoring_contract:
  truth_source: data/frozen/stage1a_truth/<dataset_id>_pseudobulk_delta_aligned.tsv.gz
  allowed_truth_space: main_aligned
  score_after_alignment_only: true
  leaderboard_eligibility_status:
    official_leaderboard_eligible: frozen truth targets 全覆盖，gene coverage 符合数据集本地要求
    degraded_or_supplementary_only: 任一 coverage 不足，但允许对交集子空间做补充评分
  primary_metric_family:
    directional_similarity: pearson_mean
    magnitude_error: rmse_mean
    top_shift_overlap: top50_jaccard_mean
  aggregation_rule:
    per_target_first: true
    dataset_level_aggregate:
      - mean
      - median
  undefined_correlation_rule: 若某个向量为常数，则完全相同记为 1.0，否则记为 0.0。
