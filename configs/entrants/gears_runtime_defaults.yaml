optimizer: adam
learning_rate: 1.0e-3
weight_decay: 1.0e-6
batch_size: 32
max_epochs: 30
early_stopping_enabled: true
early_stopping_patience: 5
validation_rule: train_only_internal_validation
checkpoint_selection_rule: best_validation_checkpoint
random_seed_policy: explicit_single_seed
device_policy: gpu_if_available_else_cpu
training_seed: 101
heldout_fraction: 0.2
train_val_fraction: 0.8
inner_seed: 11
inner_val_fraction: 0.2
selection_topk: 50
inner_metric_tie_tolerance: 1.0e-4
prediction_num_samples: 64
perturbation_graph_k: 8
max_control_cells: 2048
gears_cache_dir: artifacts/gears_cache/stage1a_smoke
