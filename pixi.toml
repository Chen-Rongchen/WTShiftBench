[workspace]
name = "wt-benchmark"
version = "0.1.0"
channels = ["pytorch", "nvidia", "conda-forge", "bioconda"]
platforms = ["linux-64"]

[activation.env]
PYTHONNOUSERSITE = "1"
# 使脚本可直接导入仓库内的 scripts/ 与 src/ 模块
PYTHONPATH = ".:scripts:src"

# ============================================================
# Feature 定义：各环境的依赖集合
# ============================================================

# Core Feature: WT Benchmark 主链路
[feature.core.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
scikit-learn = "*"
pyyaml = "*"
rich = "*"
typer = "*"
anndata = "*"
pytest = "*"

# GEARS Feature: GEARS Prediction Producer
[feature.gears.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
scikit-learn = "*"
tqdm = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
pytorch-lightning = ">=2.4,<2.6"
torch-geometric = ">=2.5,<2.7"

[feature.gears.pypi-dependencies]
cell-gears = "==0.1.2"

# scGPT Feature: scGPT Prediction Producer
[feature.scgpt.dependencies]
python = "3.10.*"
pip = "*"
ipython = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
scanpy = "*"
scikit-learn = "*"
pytorch = ">=2.3,<2.4"
pytorch-cuda = "12.1.*"
torchtext = "0.18.*"
transformers = ">=4.37,<5.0"
datasets = ">=2.3,<3.0"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"

[feature.scgpt.pypi-dependencies]
scgpt = "==0.2.4"

# Geneformer Feature: Geneformer Prediction Producer
[feature.geneformer.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
transformers = ">=4.37,<5.0"
datasets = "*"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"

[feature.geneformer.pypi-dependencies]
geneformer = { path = "vendor/geneformer" }
safetensors = ">=0.4"

# ============================================================
# 环境定义：组合 features
# ============================================================

[environments.core]
solve-group = "core"
features = ["core"]

[environments.gears]
solve-group = "gears"
features = ["gears"]

[environments.scgpt]
solve-group = "scgpt"
features = ["scgpt"]

[environments.geneformer]
solve-group = "geneformer"
features = ["geneformer"]

# ============================================================
# Tasks: 环境安装
# ============================================================
[tasks.env-install-core]
cmd = "pixi install --environment core"
description = "安装 core 环境"

[tasks.env-install-gears]
cmd = "pixi install --environment gears"
description = "安装 GEARS 环境"

[tasks.env-install-scgpt]
cmd = "pixi install --environment scgpt"
description = "安装 scGPT 环境"

[tasks.env-install-geneformer]
cmd = "pixi install --environment geneformer"
description = "安装 Geneformer 环境"

[tasks.fetch-geneformer-gf-12l-95m-i4096]
cmd = "hf download ctheodoris/Geneformer --include \"gf-12L-95M-i4096/*\" --local-dir models/pretrained/geneformer_gf_12l_95m_i4096 --revision 933ca80e39d421c47a12168699766bb7e4e2c197"
description = "下载 gf-12L-95M-i4096 权重（model.safetensors）到 models/pretrained/"

[tasks.env-install-all]
cmd = "pixi install"
description = "安装所有环境"

# ============================================================
# Tasks: 环境检查
# ============================================================
[tasks.env-check-core]
cmd = "python scripts/env/check_core_env.py"
description = "验证 core 环境"

[tasks.env-check-gears]
cmd = "python scripts/env/check_gears_env.py"
description = "验证 GEARS 环境，要求 GPU 可用"

[tasks.env-check-scgpt]
cmd = "python scripts/env/check_scgpt_env.py"
description = "验证 scGPT 环境，要求 GPU 可用"

[tasks.env-check-geneformer]
cmd = "python scripts/env/check_geneformer_env.py"
description = "验证 Geneformer 环境，要求 GPU 可用"

[tasks.check-envs]
cmd = "pixi run --environment core env-check-core && pixi run --environment gears env-check-gears && pixi run --environment scgpt env-check-scgpt && pixi run --environment geneformer env-check-geneformer"
description = "验证所有环境"

# ============================================================
# Tasks: 版本检查
# ============================================================
[tasks.versions-core]
cmd = "python scripts/env/print_versions.py core"
description = "打印 core 环境版本信息"

[tasks.versions-gears]
cmd = "python scripts/env/print_versions.py gears"
description = "打印 GEARS 环境版本信息"

[tasks.versions-scgpt]
cmd = "python scripts/env/print_versions.py scgpt"
description = "打印 scGPT 环境版本信息"

[tasks.versions-geneformer]
cmd = "python scripts/env/print_versions.py geneformer"
description = "打印 Geneformer 环境版本信息"

[tasks.check-all]
cmd = "pixi run --environment core versions-core && pixi run --environment gears versions-gears && pixi run --environment scgpt versions-scgpt && pixi run --environment geneformer versions-geneformer"
description = "打印所有环境版本信息"

[tasks.test-stage2]
cmd = "pytest tests/test_stage2_hcc_prediction_export.py tests/test_stage2_model_structure_scorer.py tests/test_stage2_truth_driven_bridge.py tests/test_stage2_truth_sensitivity.py"
description = "运行当前 Stage 2 测试"

[tasks.download-gse90063-supplementary-dry-run]
cmd = "python scripts/download_geo_supplementary.py --config configs/stage2/gse90063_supplementary_download_v1.json --dry-run --test-records"
description = "离线测试 GSE90063 supplementary 下载入口，不访问网络或下载大文件"

[tasks.download-gse90063-supplementary]
cmd = "python scripts/download_geo_supplementary.py --config configs/stage2/gse90063_supplementary_download_v1.json"
description = "下载 GSE90063 supplementary 全量文件"

# ============================================================
# Tasks: Stage 2 / manuscript 主链路任务
# ============================================================

[tasks.build-stage2-truth-driven-bridge]
cmd = "python scripts/build_stage2_truth_driven_bridge.py --config configs/stage2/truth_driven_bridge_hcc38_hcc1143_v1.json"
description = "构建 Stage 2 truth-driven bridge 主线产物"

[tasks.build-stage2-truth-driven-bridge-with-dixit]
cmd = "python scripts/build_stage2_truth_driven_bridge.py --config configs/stage2/truth_driven_bridge_hcc38_hcc1143_dixit_v1.json"
description = "Stage 2 truth bridge：HCC38 + HCC1143 + Dixit（同参数，输出写入同一 stage2 目录）"

[tasks.run-stage2-truth-bridge-sensitivity]
cmd = "python scripts/run_stage2_truth_bridge_sensitivity.py --config configs/stage2/truth_bridge_sensitivity_v1.json"
description = "Stage 2 truth bridge：control 子抽样、DEG 阈值扫描等敏感性分析"

[tasks.run-stage2-truth-bridge-sensitivity-hcc-full]
cmd = "python scripts/run_stage2_truth_bridge_sensitivity.py --config configs/stage2/truth_bridge_sensitivity_hcc_full_v1.json"
description = "Stage 2 truth bridge：HCC full closure sensitivity（含 5 条 covariate 轴）"

[tasks.materialize-stage2-covariates]
cmd = "python scripts/materialize_stage2_covariates.py --config configs/stage2/hcc_covariates_v1.json"
description = "物化 HCC Stage 2 covariates TSV"

[tasks.run-stage2-covariate-audit]
cmd = "python scripts/run_stage2_covariate_audit.py --config configs/stage2/truth_bridge_covariate_audit_v1.json"
description = "运行 HCC Stage 2 covariate balance audit"

[tasks.run-stage2-closure-pipeline]
cmd = "python scripts/run_stage2_closure_pipeline.py --config configs/stage2/stage2_closure_pipeline_v1.json"
description = "串联 HCC covariates、sensitivity 与 covariate audit"

[tasks.validate-stage2-closure-artifacts]
cmd = "python scripts/validate_stage2_closure_artifacts.py --config configs/stage2/closure_artifact_validation_v1.json"
description = "校验 Stage 2 closure 关键产物与固定边界"

[tasks.build-stage2-truth-bridge-decomposition]
cmd = "python scripts/run_stage2_truth_bridge_decomposition.py --config configs/stage2/truth_bridge_decomposition_v1.json"
description = "构建 Stage 2 truth bridge decomposition 产物"

[tasks.build-stage2-truth-driven-bridge-dixit-supplement]
cmd = "python scripts/build_stage2_truth_driven_bridge.py --config configs/stage2/truth_driven_bridge_dixit_k562_supplement.json"
description = "构建 Dixit/K562 13d supplementary truth bridge"

[tasks.run-stage2-dixit-axis-compression]
cmd = "python scripts/run_stage2_dixit_axis_compression.py --config configs/stage2/dixit_axis_compression_v1.json"
description = "运行 Dixit/K562 13d supplementary axis compression"

[tasks.run-stage2-k562-13d-minimal-tradeoff-audit]
cmd = "python scripts/run_stage2_k562_13d_minimal_tradeoff_audit.py --config configs/stage2/k562_13d_minimal_model_tradeoff_audit_v1.json"
description = "运行 GSE90063 K562 13d 最小 model-side architecture trade-off 方向审计"

[tasks.render-manuscript-figure1]
cmd = "python scripts/render_manuscript_figure1.py --config configs/manuscript/figure1_truth_object_v1.json"
description = "渲染 manuscript Figure 1 truth object"
