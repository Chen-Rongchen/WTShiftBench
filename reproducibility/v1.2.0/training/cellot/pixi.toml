[workspace]
name = "wtshiftbench"
version = "1.1.0"
channels = ["pytorch", "nvidia", "conda-forge", "bioconda"]
platforms = ["linux-64"]

# The analysis environments require a driver compatible with CUDA 12.1.
# Declaring it keeps lock resolution independent of transient driver detection.
[system-requirements]
cuda = "12.1"

[activation.env]
PYTHONNOUSERSITE = "1"
# Allow direct imports from the repository scripts/ and src/ modules
PYTHONPATH = ".:scripts:src"

# ============================================================
# Feature definitions: dependencies for each environment
# ============================================================

# Core feature: primary WT Benchmark workflow
[feature.core.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
scikit-learn = "*"
pyyaml = "*"
rich = "*"
typer = "*"
anndata = "*"
pytest = "*"
matplotlib = "*"

# GEARS Feature: GEARS Prediction Producer
[feature.gears.dependencies]
python = "3.10.*"
pip = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
scanpy = "*"
scikit-learn = "*"
matplotlib = "*"
tqdm = "*"
dcor = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
# cuda-libraries 12.1 leaves these transitive dependencies open-ended.
# Pin them to prevent the solver from mixing CUDA 13.x components into 12.1.
cuda-opencl = "12.1.*"
libcurand = "==10.3.2.106"
pytorch-lightning = ">=2.4,<2.6"
torch-geometric = ">=2.5,<2.7"
sympy = "==1.13.1"

# scGPT Feature: scGPT Prediction Producer
[feature.scgpt.dependencies]
python = "3.10.*"
pip = "*"
ipython = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
scanpy = "*"
scikit-learn = "*"
pytorch = ">=2.3,<2.4"
pytorch-cuda = "12.1.*"
cuda-opencl = "12.1.*"
libcurand = "==10.3.2.106"
torchtext = "0.18.*"
transformers = ">=4.37,<5.0"
datasets = ">=2.3,<3.0"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"
multiprocess = "==0.70.16"
dill = "==0.3.8"
# scGPT 0.2.4 also declares clustering/benchmark packages as mandatory, but
# the manuscript runners consume only the frozen checkpoint embeddings. Those
# unused evaluation packages stay out of this execution environment.

# Geneformer Feature: Geneformer Prediction Producer
[feature.geneformer.dependencies]
python = "3.10.*"
pip = "*"
wheel = "*"
git = "*"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<2.3"
scipy = ">=1.11,<1.14"
anndata = "*"
pytorch = ">=2.4,<2.6"
pytorch-cuda = "12.1.*"
cuda-opencl = "12.1.*"
libcurand = "==10.3.2.106"
transformers = ">=4.37,<5.0"
datasets = "*"
accelerate = "*"
huggingface_hub = "*"
sentencepiece = "*"
tokenizers = "*"
loompy = "*"
matplotlib-base = "*"
optuna = "*"
optuna-integration = "*"
packaging = "*"
peft = "*"
pyarrow = "*"
pytz = "*"
ray-core = "*"
scanpy = "*"
scikit-learn = "*"
seaborn = "*"
setuptools = "*"
statsmodels = "*"
tensorboard = "*"
tqdm = "*"
sympy = "==1.13.1"

[feature.geneformer.pypi-dependencies]
tdigest = "==0.5.2.2"
bitsandbytes = "==0.45.5"

[feature.geneformer.pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# CPA Feature: CPA Sensitivity Entrant
[feature.cpa.dependencies]
python = "3.10.*"
pip = "*"
wheel = "*"
setuptools = "==70.0.0"
packaging = "==24.2"
numpy = "==1.23.5"
pandas = "*"
pytorch = "==2.0.0"
pytorch-cuda = "11.7.*"
mkl = "==2024.0.0"
libcurand = "==10.2.10.91"
libcufile = "==1.3.1.18"
scipy = "==1.12.0"
matplotlib = "*"
seaborn = "*"
docrep = "==0.3.2"
anndata = "==0.9.2"
scanpy = "==1.9.3"
scvi-tools = "==0.20.3"
numba = "==0.58.1"
llvmlite = "==0.41.1"
pyarrow = "==12.0.1"

# Optional formal model features. These are isolated because each upstream
# package carries its own dependency assumptions.
[feature.cellot.dependencies]
python = "3.9.*"
pip = "*"
git = "*"
wheel = "*"
numpy = "==1.26.4"
pandas = "==2.2.3"
scipy = "==1.13.1"
scikit-learn = "==1.5.2"
anndata = "==0.10.9"
pyyaml = "==6.0.2"
absl-py = "==2.3.1"
ml-collections = "==0.1.1"
tqdm = "==4.67.1"
matplotlib-base = "==3.8.4"
seaborn = "==0.13.2"
filelock = "==3.19.1"
jinja2 = "==3.1.6"
networkx = "==3.2.1"
sympy = "==1.13.1"
fsspec = "==2024.12.0"
natsort = "==8.4.0"
array-api-compat = "==1.11.2"
python-dateutil = "==2.9.0.post0"
six = "==1.17.0"
typing-extensions = "==4.13.2"
pytorch = "==2.5.1"
pytorch-cuda = "12.1.*"
cuda-opencl = "12.1.*"
libcurand = "==10.3.2.106"
libcufile = "==1.6.0.25"
pytables = ">=3.9.2,<4"
mkl = "==2022.1.0"

[feature.scgen.dependencies]
python = "3.10.*"
pip = "==24.0"
wheel = "*"
setuptools = "==70.0.0"
packaging = "==24.2"
numpy = "==1.23.5"
pandas = "==2.2.3"
scipy = "==1.12.0"
pytorch = "==2.0.0"
pytorch-cuda = "11.7.*"
mkl = "==2024.0.0"
libcurand = "==10.2.10.91"
libcufile = "==1.3.1.18"
anndata = "==0.9.2"
scanpy = "==1.9.3"
numba = "==0.58.1"
llvmlite = "==0.41.1"
pyarrow = "==12.0.1"
adjusttext = "==1.3.0"
seaborn = "==0.13.2"
requests = "==2.32.5"
# PyTorch 2.0's Triton metadata declares these runtime requirements.
lit = ">=15,<19"

[feature.scgen.pypi-dependencies]
scgen = "==2.1.0"
scvi-tools = "==0.19.0"
jax = "==0.4.23"
jaxlib = "==0.4.23"
flax = "==0.8.4"
chex = "==0.1.7"
optax = "==0.1.7"
orbax-checkpoint = "==0.5.10"
numpyro = "==0.15.0"
ml-dtypes = "==0.3.2"
tensorstore = "==0.1.60"
mudata = "==0.2.3"
pytorch-lightning = "==1.7.7"
torchmetrics = "==0.11.4"
cmake = "==3.31.6"

[feature.scgen.pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

# ============================================================
# Environment definitions: feature combinations
# ============================================================

[environments.core]
solve-group = "core"
features = ["core"]

[environments.gears]
solve-group = "gears"
features = ["gears"]

[environments.scgpt]
solve-group = "scgpt"
features = ["scgpt"]

[environments.geneformer]
solve-group = "geneformer"
features = ["geneformer"]

[environments.cpa]
solve-group = "cpa"
features = ["cpa"]

[environments.cellot]
solve-group = "cellot"
features = ["cellot"]

[environments.scgen]
solve-group = "scgen"
features = ["scgen"]

# ============================================================
# Tasks: environment installation
# ============================================================
[tasks.env-install-core]
cmd = "pixi install --environment core"
description = "Install the core environment"

[tasks.env-install-gears]
cmd = "pixi install --environment gears"
description = "Install the GEARS environment"

[tasks.env-install-scgpt]
cmd = "pixi install --environment scgpt"
description = "Install the scGPT environment"

[tasks.env-install-geneformer]
cmd = "pixi install --environment geneformer"
description = "Install the Geneformer environment"

[tasks.env-install-cpa]
cmd = "pixi install --environment cpa"
description = "Install the CPA environment"

[tasks.env-install-cellot]
cmd = "pixi install --environment cellot"
description = "Install the candidate CellOT environment"

[tasks.env-install-scgen]
cmd = "pixi install --environment scgen"
description = "Install the candidate scGen environment"

[tasks.pip-install-gears]
cmd = "python -m pip install --timeout 120 --no-deps cell-gears==0.1.2"
description = "Install PyPI packages in the GEARS Pixi environment"

[tasks.pip-install-scgpt]
cmd = "python -m pip install --timeout 120 --no-deps scgpt==0.2.4"
description = "Install PyPI packages in the scGPT Pixi environment"

[tasks.pip-install-geneformer]
cmd = "python scripts/env/prepare_geneformer_source.py && python -m pip install --timeout 120 --no-deps --no-build-isolation /tmp/wtko_geneformer_install"
description = "Verify and install the pinned Geneformer commit for the historical analysis snapshot"

[tasks.pip-install-cpa]
# cpa-tools 0.8.8 publishes notebook/test tools as mandatory dependencies.
# Install the fixed model runtime here; the paper runner does not use that
# development toolchain.
cmd = "python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple --timeout 120 --no-deps cpa-tools==0.8.8 torchaudio==2.0.1 jax==0.4.23 jaxlib==0.4.23 flax==0.8.4 chex==0.1.7 optax==0.1.7 orbax-checkpoint==0.5.10 numpyro==0.15.0 ml-dtypes==0.3.2 tensorstore==0.1.60 mudata==0.2.3 lightning==2.2.5 pytorch-lightning==1.9.5 ray==2.9.3 rdkit-pypi==2022.9.5 fsspec==2024.12.0 requests==2.32.5 charset-normalizer==3.4.3 idna==3.10 urllib3==2.2.3 adjustText==1.3.0 gdown==5.2.0 beautifulsoup4==4.13.5 soupsieve==2.8 etils==1.12.2 nest-asyncio==1.6.0 protobuf==4.25.8 aiosignal==1.3.2 click==8.1.8 frozenlist==1.5.0 jsonschema==4.23.0 attrs==24.3.0 jsonschema-specifications==2024.10.1 referencing==0.35.1 rpds-py==0.22.3 cmake==3.31.6 lit==18.1.8"
description = "Install pinned compatibility overrides and runtime dependencies in the CPA Pixi environment"

[tasks.pip-install-cellot]
cmd = "python scripts/env/prepare_cellot_source.py && python -m pip install --no-deps /tmp/wtko_cellot_install"
description = "Rebuild and install the pinned CellOT source commit; transitive dependencies come from pixi.lock"

[tasks.pip-install-scgen]
cmd = "python -c \"import importlib.metadata as md; assert md.version('scgen') == '2.1.0'; print('scGen 2.1.0 is provided by pixi.lock')\""
description = "Verify scGen 2.1.0 managed natively by pixi.lock"

[tasks.pip-install-model-packages]
cmd = "pixi run --environment gears pip-install-gears && pixi run --environment scgpt pip-install-scgpt && pixi run --environment geneformer pip-install-geneformer && pixi run --environment cpa pip-install-cpa && pixi run --environment cellot pip-install-cellot && pixi run --environment scgen pip-install-scgen"
description = "Install packages required by the formal model environments"

[tasks.fetch-geneformer-gf-12l-95m-i4096]
cmd = "pixi run --environment geneformer hf download ctheodoris/Geneformer --include \"gf-12L-95M-i4096/*\" --local-dir models/pretrained/geneformer_gf_12l_95m_i4096 --revision 933ca80e39d421c47a12168699766bb7e4e2c197"
description = "Download gf-12L-95M-i4096 weights (model.safetensors) to models/pretrained/"

[tasks.materialize-geneformer-assets]
cmd = "pixi run --environment geneformer python scripts/env/materialize_geneformer_assets.py"
description = "Materialize gc104M dictionaries from the locked Geneformer Pixi environment into ignored model-assets"

[tasks.env-install-all]
cmd = "pixi install --all --locked && pixi run pip-install-model-packages"
description = "Install all environments and pinned source-model packages using pixi.lock"

# ============================================================
# Tasks: environment validation
# ============================================================
[tasks.env-check-core]
cmd = "python scripts/env/check_core_env.py"
description = "Validate the core environment"

[tasks.env-check-gears]
cmd = "python scripts/env/check_gears_env.py"
description = "Validate the GEARS environment, requiring GPU availability"

[tasks.env-check-scgpt]
cmd = "python scripts/env/check_scgpt_env.py"
description = "Validate the scGPT environment, requiring GPU availability"

[tasks.env-check-geneformer]
cmd = "python scripts/env/check_geneformer_env.py"
description = "Validate the Geneformer environment, requiring GPU availability"

[tasks.env-check-cpa]
cmd = "python -c \"import cpa; print('cpa import ok')\""
description = "Validate the CPA environment"

[tasks.env-check-cellot]
cmd = "python scripts/env/check_optional_model_env.py cellot"
description = "Validate the candidate CellOT environment"

[tasks.env-check-scgen]
cmd = "python scripts/env/check_optional_model_env.py scgen"
description = "Validate the candidate scGen environment"

[tasks.check-envs]
cmd = "pixi run --environment core env-check-core && pixi run --environment gears env-check-gears && pixi run --environment scgpt env-check-scgpt && pixi run --environment geneformer env-check-geneformer && pixi run --environment cpa env-check-cpa"
description = "Validate all environments"

[tasks.check-optional-model-envs]
cmd = "pixi run --environment cellot env-check-cellot && pixi run --environment scgen env-check-scgen"
description = "Validate optional formal model environments"

# ============================================================
# Tasks: version checks
# ============================================================
[tasks.versions-core]
cmd = "python scripts/env/print_versions.py core"
description = "Print core environment versions"

[tasks.versions-gears]
cmd = "python scripts/env/print_versions.py gears"
description = "Print GEARS environment versions"

[tasks.versions-scgpt]
cmd = "python scripts/env/print_versions.py scgpt"
description = "Print scGPT environment versions"

[tasks.versions-geneformer]
cmd = "python scripts/env/print_versions.py geneformer"
description = "Print Geneformer environment versions"

[tasks.versions-cpa]
cmd = "python - <<'PY'\nimport importlib.metadata as md\nimport cpa\nprint('cpa import ok')\nfor pkg in ['cpa-tools','torch','scanpy','anndata','scvi-tools']:\n    try:\n        print(pkg, md.version(pkg))\n    except md.PackageNotFoundError:\n        print(pkg, 'not installed')\nPY"
description = "Print CPA environment versions"

[tasks.check-all]
cmd = "pixi run --environment core versions-core && pixi run --environment gears versions-gears && pixi run --environment scgpt versions-scgpt && pixi run --environment geneformer versions-geneformer && pixi run --environment cpa versions-cpa"
description = "Print versions for all environments"

[tasks.test-stage2]
cmd = "pytest tests/test_hcc_prediction_export.py tests/test_model_structure_scorer.py tests/test_truth_driven_bridge.py tests/test_truth_sensitivity.py"
description = "Run the current Stage 2 tests"

# Stable public entry points used in README and CI.
[tasks.setup]
cmd = "pixi install --environment core"
description = "Install the core reproducibility environment"

[tasks.check-env]
cmd = "python scripts/env/check_core_env.py"
description = "Validate the core reproducibility environment"

[tasks.test]
cmd = "pytest -q"
description = "Run the public test suite"

[tasks.revision-inventory]
cmd = "python scripts/revision/build_revision_asset_inventory.py --registry configs/revision/revision_analysis_registry_v1.json"
description = "Generate frozen revision assets and the model-context completion inventory"

[tasks.revision-m1-bridge]
cmd = "python scripts/revision/run_m1_bridge_sensitivity.py --registry configs/revision/revision_analysis_registry_v1.json"
description = "Run M1 perturbed-cell sampling-confounding audit"

[tasks.revision-m1-finalize]
cmd = "python scripts/revision/finalize_m1_outputs.py --output-root reports/revision/m1_bridge_confounding"
description = "Consolidate existing robustness assets and freeze M1_FINAL"

[tasks.revision-m2-endpoint]
cmd = "python scripts/revision/run_m2_endpoint_object.py --config configs/revision/revision_endpoint_object_v1.json"
description = "Materialize the sampling-aware endpoint object and corrected categories"

[tasks.revision-m2-attrition]
cmd = "python scripts/revision/run_m2_attrition_audit.py --config configs/revision/revision_attrition_audit_v1.json"
description = "Run M2 HCC target/cell/gene attrition and filter-on/off audit"

[tasks.revision-m3-references]
cmd = "python scripts/revision/run_m3_reference_validation.py --config configs/revision/revision_metric_spec_v1.json"
description = "Run M3 signed-direction and reference-control validation"

[tasks.revision-m4-hcc-audit]
cmd = "python scripts/revision/run_m4_hcc_audit.py --config configs/revision/revision_hcc_full_audit_v1.json"
description = "Run M4 revised HCC five-dimensional full audit"

[tasks.revision-m5-qualify]
cmd = "pixi run --environment geneformer python scripts/revision/run_m5_candidate_qualification.py --config configs/revision/revision_m5_candidate_qualification_v1.json"
description = "Run M5 independent-context sampling-aware qualification"

[tasks.revision-m5-audit]
cmd = "pixi run --environment geneformer python scripts/revision/run_m5_full_audit.py --config configs/revision/revision_m5_full_audit_v1.json"
description = "Run M5 selected independent-context full audit"

[tasks.revision-m6-endpoint-tuning]
cmd = "python scripts/revision/run_m6_endpoint_tuning.py --config configs/revision/revision_m6_endpoint_tuning_v1.json"
description = "Run M6 frozen-versus-endpoint-tuned counterfactual"

[tasks.revision-test-external-count]
cmd = "python scripts/revision/test_external_cell_count.py"
description = "Test partial correlations controlling target cell count in six existing external contexts"

[tasks.build-figures]
cmd = "bash reproduce_figures.sh"
description = "Regenerate active editable SVG panels and panel source data"

[tasks.materialize-edfig1]
cmd = "python scripts/figures/materialize_extended_data_figure1.py"
description = "Materialize Extended Data Figure 1 profile and readout inputs"

[tasks.build-registry]
cmd = "python scripts/pipeline/build_resource_registry.py --config configs/resource_registry_v1.json && cp benchmark/registry/figure_source_data_manifest.tsv source_data/figure_source_data_manifest.tsv"
description = "Rebuild the governed benchmark registry"

[tasks.plan-data]
cmd = "python scripts/download/build_dataset_acquisition_manifest.py --config configs/dataset_acquisition_registry_v1.json"
description = "Generate the public dataset-acquisition plan"

[tasks.download-gse90063]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json"
description = "Download GSE90063 supplementary files"

[tasks.download-gse264667]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json"
description = "Download GSE264667 supplementary files"

[tasks.wtbench]
cmd = "python -m wtbench"
description = "Unified WT Benchmark CLI; commands are registered dynamically from configs/runtime/wtbench_cli_v1.json"

[tasks.download-gse90063-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json --dry-run --test-records"
description = "Offline test of GSE90063 supplementary download entry points without network access or large downloads"

[tasks.download-gse90063-supplementary]
cmd = "python scripts/download/geo_supplementary.py --config configs/gse90063_supplementary_download_v1.json"
description = "Download all GSE90063 supplementary files"

[tasks.plan-dataset-acquisition]
cmd = "python scripts/download/build_dataset_acquisition_manifest.py --config configs/dataset_acquisition_registry_v1.json"
description = "Generate a dataset download manifest and shell plan prioritizing original sources"

[tasks.audit-local-datasets]
cmd = "python scripts/pipeline/audit_local_dataset_inventory.py --config configs/dataset_acquisition_registry_v1.json"
description = "Audit local HCC/K562/candidate dataset availability and basic h5ad structure"

[tasks.download-gse264667-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json --dry-run"
description = "Generate the GSE264667 GEO supplementary manifest without downloading files"

[tasks.download-gse264667-supplementary]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse264667_supplementary_v1.json"
description = "Download GSE264667 GEO supplementary files"

[tasks.download-gse200201-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse200201_supplementary_v1.json --dry-run"
description = "Generate the GSE200201 MOLM13 GEO supplementary manifest without downloading files"

[tasks.download-gse90546-supplementary-dry-run]
cmd = "python scripts/download/geo_supplementary.py --config configs/download_gse90546_supplementary_v1.json --dry-run"
description = "Generate the GSE90546 Adamson K562 GEO supplementary manifest without downloading files"

# ============================================================
# Tasks: primary Stage 2 / manuscript workflow
# ============================================================

[tasks.build-stage2-truth-driven-bridge]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_hcc38_hcc1143_v1.json"
description = "Build the primary Stage 2 truth-driven bridge outputs"

[tasks.convert-rnai-demeter2-depmap-endpoints]
cmd = "python scripts/convert_rnai_demeter2_to_depmap_endpoints.py --config configs/rnai_demeter2_conversion_v1.json"
description = "Convert DEMETER2 RNAi scores to a wide DepMap endpoint table readable by the existing bridge"

[tasks.build-stage2-truth-driven-bridge-k562-7d-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_dixit_k562_tf_7d_gse90063_rnai_demeter2_v1.json"
description = "Build the GSE90063 K562 7d CRISPR KO truth versus DEMETER2 RNAi endpoint bridge"

[tasks.build-stage2-truth-driven-bridge-k562-13d-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_dixit_k562_tf_13d_gse90063_rnai_demeter2_v1.json"
description = "Build the GSE90063 K562 13d CRISPR KO truth versus DEMETER2 RNAi endpoint bridge"

[tasks.build-stage2-truth-driven-bridge-hcc38-hcc1143-rnai-demeter2]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_hcc38_hcc1143_rnai_demeter2_v1.json"
description = "Build the HCC38 + HCC1143 CRISPR KO truth versus DEMETER2 RNAi endpoint bridge"

[tasks.run-stage2-hcc38-hcc1143-rnai-endpoint-consistency]
cmd = "python scripts/pipeline/k562_rnai_endpoint_consistency.py --config configs/hcc38_hcc1143_rnai_endpoint_consistency_v1.json"
description = "Summarize CRISPR DepMap versus DEMETER2 RNAi endpoint consistency in HCC38 + HCC1143"

[tasks.build-stage2-replogle-k562-gwps-day8]
cmd = "python scripts/pipeline/build_truth_driven_bridge.py --config configs/truth_driven_bridge_replogle_k562_gwps_day8_v1.json"
description = "Build boundary-aware bridge-form evidence for Replogle K562 GWPS day 8 CRISPRi"

[tasks.run-stage2-k562-rnai-endpoint-consistency]
cmd = "python scripts/pipeline/k562_rnai_endpoint_consistency.py --config configs/k562_rnai_endpoint_consistency_v1.json"
