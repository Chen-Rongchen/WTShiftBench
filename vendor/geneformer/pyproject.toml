[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneformer"
version = "0.1.0.post2"
description = "Patched local Geneformer package for WT Benchmark"
requires-python = ">=3.10,<3.11"
dependencies = [
  "anndata",
  "bitsandbytes",
  "datasets",
  "loompy",
  "matplotlib",
  "numpy",
  "optuna",
  "optuna-integration",
  "packaging",
  "pandas",
  "peft",
  "pyarrow",
  "pytz",
  "ray",
  "scanpy",
  "scikit-learn",
  "scipy",
  "seaborn",
  "setuptools",
  "statsmodels",
  "tdigest",
  "tensorboard",
  "torch",
  "tqdm",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geneformer", "geneformer.*"]

[tool.setuptools.package-data]
geneformer = ["*.pkl", "gene_dictionaries_30m/*.pkl"]
