name: v1.2.1公开源码轻量检查

on:
  push:
    branches: [main]
    paths: ['reproducibility/v1.2.1/**', '.github/workflows/public-checks.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.66.0
          manifest-path: reproducibility/v1.2.1/pixi.toml
          environments: core
          frozen: true
          cache: true
      - name: 不依赖私有稿件的合成输入测试
        working-directory: reproducibility/v1.2.1
        run: pixi run --frozen --environment core python -m pytest tests -q
